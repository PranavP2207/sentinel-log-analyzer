name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version and release notes
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          from sentinel import __version__
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag == 'v' + version == 'v' + __version__, 'Tag and package versions must agree'
          assert Path('docs/releases', tag + '.md').is_file(), 'Versioned release notes are required'
          PY
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Smoke test installed package
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          sentinel --version
          sentinel analyze "$GITHUB_WORKSPACE/examples/auth.log" --year 2026 --format json --output smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('smoke.json').read_text())
          assert report['status'] == 'ok'
          assert [item['rule'] for item in report['alerts']] == ['success_after_failures', 'repeated_failures', 'multiple_usernames']
          PY
      - name: Generate checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assets = sorted(path for path in Path('dist').iterdir() if path.name.endswith(('.whl', '.tar.gz')))
          assert len(assets) == 2, 'Expected a wheel and source archive'
          lines = [hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name for path in assets]
          Path('dist/SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "Sentinel $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest
