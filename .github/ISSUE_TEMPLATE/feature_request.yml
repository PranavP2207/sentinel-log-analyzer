name: Feature request
description: Suggest a focused improvement or supported format.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What task is difficult with Sentinel today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives and synthetic examples if relevant.
    validations:
      required: true
